<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Служба поддержки</title>
<style>
:root{
  --bg:#f4f6fb; --surface:#fff; --text:#1c2333; --muted:#6b7488; --line:#e3e7f0;
  --primary:#3b5bdb; --primary-d:#2f49b3; --primary-l:#edf0ff;
  --new:#1971c2; --new-bg:#e7f1fb; --work:#e67700; --work-bg:#fff4e0; --done:#2f9e44; --done-bg:#e6f6ea;
  --bad:#e03131; --bad-bg:#fdeaea; --shadow:0 1px 3px rgba(20,30,60,.08),0 6px 18px rgba(20,30,60,.05);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#10131c; --surface:#181c28; --text:#e6e9f2; --muted:#8c95aa; --line:#272d3d;
    --primary:#6c8cff; --primary-d:#8aa3ff; --primary-l:#222a4a;
    --new-bg:#17314d; --work-bg:#3d2d10; --done-bg:#16361f; --bad-bg:#432024; --shadow:0 1px 3px rgba(0,0,0,.4)}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.hidden{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}

/* шапка */
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1080px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:24px}
.logo{font-weight:700;font-size:17px;display:flex;align-items:center;gap:10px}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--primary);color:#fff;display:grid;place-items:center;font-style:normal;font-size:16px}
nav{display:flex;gap:4px;flex:1}
nav button{background:none;border:0;padding:8px 14px;border-radius:8px;color:var(--muted);cursor:pointer;font-weight:500}
nav button:hover{background:var(--bg)}
nav button.active{background:var(--primary-l);color:var(--primary)}
.user{display:flex;align-items:center;gap:10px;font-size:14px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--primary-l);color:var(--primary);display:grid;place-items:center;font-weight:700}
.user small{display:block;color:var(--muted);line-height:1.1}

main{max-width:1080px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:18px 20px}

/* кнопки и поля */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 16px;border-radius:9px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-d);color:#fff}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary-l);border-color:var(--primary)}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
textarea{resize:vertical;min-height:90px}

/* вход */
#loginView{min-height:100vh;display:grid;place-items:center;padding:20px}
.login{width:100%;max-width:380px;padding:30px}
.login .logo{justify-content:center;margin-bottom:6px;font-size:20px}
.login p{text-align:center;color:var(--muted);margin:0 0 22px}
.field{margin-bottom:14px}
.hint{font-size:13px;color:var(--muted);margin-top:16px;text-align:center}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}

/* панель фильтров */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:16px}
.toolbar .field{margin:0;min-width:170px}
.toolbar .grow{flex:1}
.count{color:var(--muted);font-size:14px;padding-bottom:10px}

/* таблицы */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer}
tbody tr.row:hover{background:var(--primary-l)}
td.num,th.num{text-align:right}
.id{color:var(--muted);font-variant-numeric:tabular-nums}
.title{font-weight:500}
.tablewrap{overflow-x:auto;border-radius:14px}

/* бейджи */
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap}
.badge.new{background:var(--new-bg);color:var(--new)}
.badge.in_progress{background:var(--work-bg);color:var(--work)}
.badge.closed{background:var(--done-bg);color:var(--done)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.ok{background:var(--done-bg);color:var(--done)}
.role{font-size:12px;color:var(--muted)}

.pager{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:16px;color:var(--muted)}

/* карточка заявки */
.back{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
@media(max-width:820px){.grid2{grid-template-columns:1fr}.bar{gap:10px}.user div{display:none}}
.body{white-space:pre-wrap;margin:14px 0 0;color:var(--text)}
.meta{display:grid;gap:14px}
.meta dt{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.meta dd{margin:2px 0 0;font-weight:500}
.steps{display:flex;gap:6px;margin:18px 0 4px}
.step{flex:1;text-align:center;font-size:12.5px;padding:7px 4px;border-radius:8px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.step.done{background:var(--done-bg);color:var(--done);border-color:transparent}
.step.cur{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600}
.reaction{padding:12px 14px;border-radius:10px;margin-top:6px}
.reaction.ok{background:var(--done-bg)}
.reaction.bad{background:var(--bad-bg)}
.reaction b{display:block;font-size:17px}
.reaction span{font-size:13px;color:var(--muted)}
.comments{margin-top:18px}
.comments h3{margin:0 0 12px;font-size:16px}
.msg{display:flex;gap:12px;margin-bottom:14px}
.msg .avatar{flex:none}
.bubble{background:var(--bg);border-radius:12px;padding:10px 14px;flex:1}
.msg.agent .bubble{background:var(--primary-l)}
.bubble .who{font-weight:600;font-size:14px}
.bubble .when{color:var(--muted);font-size:12.5px;margin-left:8px;font-weight:400}
.bubble p{margin:4px 0 0;white-space:pre-wrap}
.newcomment{margin-top:8px}
.newcomment .actions{margin-top:8px;display:flex;gap:10px;align-items:center}

/* сводка */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
@media(max-width:700px){.kpis{grid-template-columns:1fr}}
.kpi{padding:18px 20px}
.kpi span{color:var(--muted);font-size:13px}
.kpi b{display:block;font-size:30px;line-height:1.2;margin-top:4px}
.kpi.bad b{color:var(--bad)}
.bar-bg{height:8px;border-radius:99px;background:var(--bg);min-width:110px;overflow:hidden}
.bar-fg{height:100%;border-radius:99px;background:var(--bad)}
.cell-share{display:flex;align-items:center;gap:10px}
.cell-share span{min-width:46px;text-align:right;font-variant-numeric:tabular-nums}

/* модальное окно */
.modal{position:fixed;inset:0;background:rgba(10,15,30,.5);display:grid;place-items:center;padding:20px;z-index:20}
.dialog{width:100%;max-width:520px;padding:24px}
.dialog h2{margin:0 0 16px;font-size:19px}
.dialog .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.empty{padding:40px;text-align:center;color:var(--muted)}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1c2333;color:#fff;padding:10px 18px;border-radius:10px;box-shadow:var(--shadow);z-index:30}
#toast.bad{background:var(--bad)}
</style>
</head>
<body>

<!-- вход -->
<div id="loginView">
  <div class="card login">
    <div class="logo"><i>П</i> Служба поддержки</div>
    <p>Войдите, чтобы работать с заявками</p>
    <div class="field"><label for="login">Логин</label><input id="login" value="agent1" autocomplete="username"></div>
    <div class="field"><label for="password">Пароль</label><input id="password" type="password" value="demo" autocomplete="current-password"></div>
    <button class="btn primary" style="width:100%" onclick="doLogin()">Войти</button>
    <div class="err" id="loginErr"></div>
    <div class="hint">Сотрудник: agent1 · Заказчик: customer1 · пароль: demo</div>
  </div>
</div>

<!-- приложение -->
<div id="app" class="hidden">
  <header><div class="bar">
    <div class="logo"><i>П</i> Поддержка</div>
    <nav>
      <button id="tabList" onclick="show('list')">Заявки</button>
      <button id="tabSummary" onclick="show('summary')">Сводка</button>
    </nav>
    <div class="user">
      <div class="avatar" id="avatar"></div>
      <div><span id="uname"></span><small id="urole"></small></div>
      <button class="btn ghost" onclick="doLogout()">Выйти</button>
    </div>
  </div></header>

  <main>
    <section id="list">
      <h1>Заявки</h1>
      <p class="sub" id="listSub"></p>
      <div class="toolbar">
        <div class="field"><label for="fStatus">Статус</label>
          <select id="fStatus" onchange="page=1;loadList()">
            <option value="">Все статусы</option><option value="new">Новая</option>
            <option value="in_progress">В работе</option><option value="closed">Закрыта</option></select></div>
        <div class="field"><label for="fCat">Категория</label>
          <select id="fCat" onchange="page=1;loadList()"><option value="">Все категории</option></select></div>
        <span class="count" id="total"></span>
        <div class="grow"></div>
        <button class="btn primary" onclick="openNew()">+ Новая заявка</button>
      </div>
      <div class="card tablewrap">
        <table>
          <thead><tr><th>№</th><th>Тема</th><th>Статус</th><th>Категория</th><th>Автор</th><th>Создана</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="pager">
        <button class="btn" id="prev" onclick="go(-1)">← Назад</button>
        <span id="pg"></span>
        <button class="btn" id="next" onclick="go(1)">Вперёд →</button>
      </div>
    </section>

    <section id="card" class="hidden"></section>

    <section id="summary" class="hidden">
      <h1>Сводка</h1>
      <p class="sub">Открытые заявки по категориям и доля тех, где нарушен норматив срока реакции</p>
      <div id="sumBody"></div>
    </section>
  </main>
</div>

<!-- новая заявка -->
<div class="modal hidden" id="newModal" onclick="if(event.target===this)closeNew()">
  <div class="card dialog">
    <h2>Новая заявка</h2>
    <div class="field"><label for="nTitle">Тема</label><input id="nTitle" maxlength="200" placeholder="Коротко о проблеме"></div>
    <div class="field"><label for="nCat">Категория</label><select id="nCat"></select></div>
    <div class="field"><label for="nBody">Описание</label><textarea id="nBody" placeholder="Что случилось, когда началось, что уже пробовали"></textarea></div>
    <div class="err" id="nErr"></div>
    <div class="actions"><button class="btn" onclick="closeNew()">Отмена</button>
      <button class="btn primary" onclick="createTicket()">Создать</button></div>
  </div>
</div>
<div id="toast" class="hidden"></div>

<script>
let page = 1, size = 20, total = 0, me = null, cats = [];
const $ = id => document.getElementById(id);
const STATUS = {new: 'Новая', in_progress: 'В работе', closed: 'Закрыта'};
const ROLE = {agent: 'Сотрудник поддержки', customer: 'Заказчик'};
const NEXT = {new: 'in_progress', in_progress: 'closed'};
const ACTION = {new: 'Взять в работу', in_progress: 'Закрыть заявку'};

async function api(method, url, body) {
  const r = await fetch(url, {method, headers: {'Content-Type': 'application/json'}, body: body ? JSON.stringify(body) : undefined});
  const data = r.status === 204 ? null : await r.json().catch(() => null);
  if (!r.ok) {
    const d = data && data.detail;
    throw new Error(typeof d === 'string' ? d : r.status === 422 ? 'Проверьте заполнение полей' : 'Ошибка ' + r.status);
  }
  return data;
}
function toast(text, bad) {
  const t = $('toast'); t.textContent = text; t.className = bad ? 'bad' : '';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = 'hidden', 3000);
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const fmtDate = s => new Date(s).toLocaleString('ru-RU', {day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'});
const badge = s => `<span class="badge ${s}">${STATUS[s]}</span>`;
const initials = name => name.split(' ').map(w => w[0]).join('').slice(0, 2);
function fmtMin(m) {
  m = Math.round(m);
  if (m < 60) return m + ' мин';
  if (m < 1440) return Math.floor(m / 60) + ' ч ' + (m % 60) + ' мин';
  return Math.floor(m / 1440) + ' дн ' + Math.floor((m % 1440) / 60) + ' ч';
}

/* вход и выход */
async function doLogin() {
  try {
    me = await api('POST', '/api/login', {login: $('login').value, password: $('password').value});
    $('loginView').classList.add('hidden'); $('app').classList.remove('hidden');
    $('uname').textContent = me.name; $('urole').textContent = ROLE[me.role];
    $('avatar').textContent = initials(me.name);
    $('tabSummary').classList.toggle('hidden', me.role !== 'agent');
    $('listSub').textContent = me.role === 'agent' ? 'Все заявки службы поддержки' : 'Ваши заявки';
    cats = await api('GET', '/api/categories');
    for (const c of cats) { $('fCat').add(new Option(c.name, c.id)); $('nCat').add(new Option(c.name, c.id)); }
    show('list');
  } catch (e) { $('loginErr').textContent = e.message; }
}
async function doLogout() { await api('POST', '/api/logout'); location.reload(); }
['login', 'password'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); }));

function show(name) {
  for (const s of ['list', 'card', 'summary']) $(s).classList.toggle('hidden', s !== name);
  $('tabList').classList.toggle('active', name === 'list' || name === 'card');
  $('tabSummary').classList.toggle('active', name === 'summary');
  if (name === 'list') loadList().catch(e => toast(e.message, true));
  if (name === 'summary') loadSummary().catch(e => toast(e.message, true));
}

/* список */
async function loadList() {
  let q = `/api/tickets?page=${page}&size=${size}`;
  if ($('fStatus').value) q += '&status=' + $('fStatus').value;
  if ($('fCat').value) q += '&category_id=' + $('fCat').value;
  const d = await api('GET', q); total = d.total;
  const pages = Math.max(1, Math.ceil(total / size));
  $('total').textContent = 'Найдено: ' + total.toLocaleString('ru-RU');
  $('rows').innerHTML = d.items.length ? d.items.map(t => `
    <tr class="row" onclick="openCard(${t.id})">
      <td class="id">${t.id}</td><td class="title">${esc(t.title)}</td><td>${badge(t.status)}</td>
      <td>${esc(t.category.name)}</td><td>${esc(t.author.name)}</td><td>${fmtDate(t.created_at)}</td></tr>`).join('')
    : '<tr><td colspan="6" class="empty">Заявок не найдено</td></tr>';
  $('pg').textContent = `Страница ${page} из ${pages.toLocaleString('ru-RU')}`;
  $('prev').disabled = page <= 1; $('next').disabled = page >= pages;
}
function go(d) { page = Math.max(1, page + d); loadList().catch(e => toast(e.message, true)); }

/* новая заявка */
function openNew() { $('nErr').textContent = ''; $('newModal').classList.remove('hidden'); $('nTitle').focus(); }
function closeNew() { $('newModal').classList.add('hidden'); }
async function createTicket() {
  try {
    await api('POST', '/api/tickets', {title: $('nTitle').value, body: $('nBody').value, category_id: +$('nCat').value});
    $('nTitle').value = ''; $('nBody').value = ''; closeNew(); page = 1; toast('Заявка создана'); loadList();
  } catch (e) { $('nErr').textContent = e.message; }
}

/* карточка */
async function openCard(id) {
  const t = await api('GET', '/api/tickets/' + id).catch(e => { toast(e.message, true); throw e; });
  const order = ['new', 'in_progress', 'closed'], cur = order.indexOf(t.status);
  const steps = order.map((s, k) => `<div class="step ${k < cur ? 'done' : k === cur ? 'cur' : ''}">${STATUS[s]}</div>`).join('');
  const canMove = me.role === 'agent' && NEXT[t.status];
  $('card').innerHTML = `
    <button class="btn ghost back" onclick="show('list')">← К списку заявок</button>
    <div class="grid2">
      <div>
        <div class="card pad">
          <div class="id">Заявка №${t.id}</div>
          <h1>${esc(t.title)}</h1>
          <div class="steps">${steps}</div>
          <p class="body">${esc(t.body)}</p>
        </div>
        <div class="card pad comments">
          <h3>Переписка (${t.comments.length})</h3>
          ${t.comments.length ? t.comments.map(c => `
            <div class="msg ${c.author.role}">
              <div class="avatar">${esc(initials(c.author.name))}</div>
              <div class="bubble"><span class="who">${esc(c.author.name)}</span>
                <span class="when">${c.author.role === 'agent' ? 'сотрудник · ' : ''}${fmtDate(c.created_at)}</span>
                <p>${esc(c.body)}</p></div></div>`).join('') : '<div class="sub">Комментариев пока нет</div>'}
          ${t.status !== 'closed' ? `<div class="newcomment">
            <textarea id="cBody" placeholder="Написать комментарий…"></textarea>
            <div class="actions"><button class="btn primary" onclick="addComment(${t.id})">Отправить</button>
              <span class="err" id="cErr"></span></div></div>` : '<div class="sub">Заявка закрыта, комментарии недоступны</div>'}
        </div>
      </div>
      <div class="card pad"><dl class="meta">
        <div><dt>Статус</dt><dd>${badge(t.status)}</dd></div>
        <div><dt>Категория</dt><dd>${esc(t.category.name)}</dd></div>
        <div><dt>Автор</dt><dd>${esc(t.author.name)}</dd></div>
        <div><dt>Создана</dt><dd>${fmtDate(t.created_at)}</dd></div>
        <div><dt>Срок реакции</dt>
          <div class="reaction ${t.norm_violated ? 'bad' : 'ok'}"><b>${fmtMin(t.reaction_minutes)}</b>
            <span>норматив ${fmtMin(t.reaction_norm_minutes)} · ${t.norm_violated ? 'нарушен' : 'соблюдён'}</span></div></div>
        ${canMove ? `<button class="btn primary" onclick="setStatus(${t.id},'${NEXT[t.status]}')">${ACTION[t.status]}</button>` : ''}
      </dl></div>
    </div>`;
  show('card');
}
async function setStatus(id, s) {
  try { await api('PATCH', `/api/tickets/${id}/status`, {status: s}); toast('Статус изменён'); openCard(id); }
  catch (e) { toast(e.message, true); }
}
async function addComment(id) {
  try { await api('POST', `/api/tickets/${id}/comments`, {body: $('cBody').value}); toast('Комментарий добавлен'); openCard(id); }
  catch (e) { $('cErr').textContent = e.message; }
}

/* сводка */
async function loadSummary() {
  const d = await api('GET', '/api/summary');
  const pct = x => (x * 100).toFixed(1).replace('.', ',') + ' %';
  $('sumBody').innerHTML = `
    <div class="kpis">
      <div class="card kpi"><span>Открытых заявок</span><b>${d.open_total.toLocaleString('ru-RU')}</b></div>
      <div class="card kpi bad"><span>Норматив нарушен</span><b>${d.violated_total.toLocaleString('ru-RU')}</b></div>
      <div class="card kpi"><span>Доля нарушений</span><b>${pct(d.violated_share)}</b></div>
    </div>
    <div class="card tablewrap"><table>
      <thead><tr><th>Категория</th><th class="num">Норматив</th><th class="num">Открыто</th><th class="num">Нарушено</th><th>Доля нарушений</th></tr></thead>
      <tbody>${d.by_category.map(c => `<tr>
        <td class="title">${esc(c.name)}</td><td class="num">${fmtMin(c.reaction_norm_minutes)}</td>
        <td class="num">${c.open.toLocaleString('ru-RU')}</td><td class="num">${c.violated.toLocaleString('ru-RU')}</td>
        <td><div class="cell-share"><div class="bar-bg"><div class="bar-fg" style="width:${c.violated_share * 100}%"></div></div>
          <span>${pct(c.violated_share)}</span></div></td></tr>`).join('')}</tbody></table></div>`;
}
</script>
</body>
</html>
